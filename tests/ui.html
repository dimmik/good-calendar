<!doctype html>
<meta charset="utf-8">
<title>UI check</title>
<style>
  body { margin: 0; display: flex; gap: 10px; background: #888; }
  iframe { border: 0; background: #fff; }
</style>
<!-- Dev helper: opens the app in frames and drives the dialogs, for screenshots. -->
<iframe id="a" src="../" width="390" height="860"></iframe>
<iframe id="b" src="../" width="390" height="860"></iframe>
<iframe id="c" width="600" height="860"></iframe>
<script type="module">
  import { defaultState, encodeShare } from '../js/store.js';
  const st = defaultState();
  st.events.push({ id: 'imp1', title: 'Концерт', date: '2026-12-12', time: '19:00', repeat: 'none', color: '#c64fbf', emoji: '🎸', countdown: true, u: 1 });
  const code = await encodeShare(st);
  document.getElementById('c').src = `../#import=${code}`;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  await wait(1200);
  // pretend the server has a newer version, to show the update bar
  const fa = document.getElementById('a').contentWindow;
  fa.fetch = () => Promise.resolve(new fa.Response("export const VERSION = '9.9.9';"));
  document.getElementById('b').contentDocument.getElementById('shareBtn').click();
</script>
