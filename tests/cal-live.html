<!doctype html>
<meta charset="utf-8">
<title>Shared calendar live test</title>
<pre id="out">running…</pre>
<iframe id="app" src="../" width="420" height="900"></iframe>
<script type="module">
// Dev helper: drives "new shared calendar" in the real app against a GitHub repo and plays a second
// device with the module API. Open as  tests/cal-live.html#repo=owner/name&t=<token>  in a fresh profile.
// Never prints the token; deletes the calendar file at the end.
import { parseJoin, emptyShared, mergeShared, canonicalShared, packShared, normalizeShared } from '../js/shared.js';
import { createSync, getRemote, newKey } from '../js/sync.js';

const out = document.getElementById('out');
const params = new URLSearchParams(location.hash.slice(1));
history.replaceState(null, '', location.pathname);
const repo = params.get('repo');
const token = params.get('t');
const results = [];
const eq = (name, got, want) => results.push([JSON.stringify(got) === JSON.stringify(want), name, got, want]);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 30000) => { const t0 = Date.now(); while (Date.now() - t0 < ms) { const v = await fn(); if (v) return v; await wait(200); } return null; };

const frame = document.getElementById('app');
await new Promise((r) => frame.addEventListener('load', r, { once: true }));
await wait(800);
const d = frame.contentDocument;
const w = frame.contentWindow;
w.confirm = () => true;
let member = null;
try {
  // 1. create
  d.getElementById('settingsBtn').click();
  d.getElementById('calNewName').value = 'Тест-семья';
  d.getElementById('calRepo').value = repo;
  d.getElementById('calToken').value = token;
  d.querySelector('[data-act="cal-create"]').click();
  const link = await until(() => d.getElementById('shareDlg').open && d.getElementById('shareLink').value.includes('#join=') && d.getElementById('shareLink').value);
  eq('invitation shown', !!link, true);
  const j = parseJoin(link);
  member = j.member;
  eq('invitation name', j.name, 'Тест-семья');
  eq('file under cal/', member.path, `cal/${member.id}.enc`);
  const unpack = (o) => normalizeShared(o, member.id);
  const r0 = await getRemote(member, unpack);
  eq('file created and readable with the invitation key', [!!r0, r0 && r0.state.name], [true, 'Тест-семья']);
  let kind = '';
  try { await getRemote({ ...member, key: newKey() }, unpack); } catch (e) { kind = e.kind; }
  eq('another key cannot read it', kind, 'key');
  d.getElementById('shareDlg').close();
  d.getElementById('setDlg').close();

  // 2. an event added in the app goes to that calendar's file
  d.getElementById('addBtn').click();
  const f = d.getElementById('evForm');
  eq('calendar choice shown in the event dialog', d.getElementById('evCalFld').hidden, false);
  f.title.value = 'Термы';
  f.cal.value = member.id;
  f.cal.dispatchEvent(new Event('change'));
  eq('colour hidden for a shared calendar', d.getElementById('evColors').hidden, true);
  f.requestSubmit();
  const r1 = await until(async () => { const r = await getRemote(member, unpack); return r && r.state.events.some((e) => e.title === 'Термы') && r; });
  eq('event pushed to the shared file', !!r1, true);
  if (!r1) {
    d.getElementById('settingsBtn').click();
    const stEl = d.getElementById(`calSt-${member.id}`);
    results.push([false, 'status after edit', stEl && stEl.textContent, '']);
    d.getElementById('setDlg').close();
  }
  const personal = JSON.parse(w.localStorage.getItem('good-calendar:v1'));
  eq('not in the personal events', personal.events.some((e) => e.title === 'Термы'), false);
  eq('calendar name in the countdowns', d.getElementById('cdList').textContent.includes('Тест-семья'), true);

  // 3. another device adds an event; this one picks it up
  let b = emptyShared(member.id);
  const devB = createSync({
    getConfig: () => member, saveConfig: () => {}, getState: () => b, setState: (s) => { b = s; },
    merge: mergeShared, canon: canonicalShared, pack: packShared, unpack,
  });
  await devB.run();
  eq('second device sees the event', b.events.map((e) => e.title), ['Термы']);
  b = { ...b, events: [...b.events, { id: 'devb1', title: 'Поход на Фрушку', date: '2026-12-20', time: '', repeat: 'none', color: '#2f9e5b', emoji: '', countdown: true, u: Date.now() }] };
  // GitHub may answer 5xx on quick successive commits (and still make them): retry like the app would later
  await until(async () => { await devB.run(); return devB.status().state === 'ok'; }, 60000);
  d.getElementById('settingsBtn').click();
  const got = await until(async () => {
    d.querySelector(`.cal-row[data-cid="${member.id}"] [data-act="cal-sync"]`).click();
    await wait(1500);
    return d.getElementById('evList').textContent.includes('Поход на Фрушку');
  }, 60000);
  eq('event from the other device shown', !!got, true);
  if (!got) {
    const rr = await getRemote(member, unpack);
    results.push([false, 'diag', { devB: devB.status(), remote: rr && rr.state.events.map((e) => e.title), appStatus: (d.getElementById(`calSt-${member.id}`) || {}).textContent, cache: JSON.parse(w.localStorage.getItem(`good-calendar:cal:${member.id}`)).events.map((e) => e.title) }, '']);
  }

  // 4. rename travels too
  const nameIn = d.querySelector(`.cal-row[data-cid="${member.id}"] .cal-name`);
  nameIn.value = 'Семья';
  nameIn.dispatchEvent(new Event('change', { bubbles: true }));
  await until(async () => { await devB.run(); return b.name === 'Семья'; });
  eq('rename reaches the other device', b.name, 'Семья');

  // 5. leave
  d.querySelector(`.cal-row[data-cid="${member.id}"] [data-act="cal-leave"]`).click();
  await wait(300);
  const after = JSON.parse(w.localStorage.getItem('good-calendar:v1'));
  eq('membership removed', after.cals.length, 0);
  eq('cache removed', w.localStorage.getItem(`good-calendar:cal:${member.id}`), null);
  eq('events gone from the view', d.getElementById('evList').textContent.includes('Термы'), false);
} catch (e) {
  results.push([false, 'exception', String(e && e.message), '']);
}
// cleanup
if (member) {
  let status = 0;
  for (let i = 0; i < 5 && status !== 200; i++) {
    if (i) await wait(3000);
    const j = await fetch(`https://api.github.com/repos/${repo}/contents/${member.path}`, { headers: { Authorization: `Bearer ${token}` }, cache: 'no-store' }).then((r) => r.json());
    const del = await fetch(`https://api.github.com/repos/${repo}/contents/${member.path}`, {
      method: 'DELETE',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'remove shared calendar self-test file', sha: j.sha }),
    });
    status = del.status;
  }
  eq('cleanup', status, 200);
}
const fails = results.filter((r) => !r[0]);
out.textContent = `${results.length - fails.length}/${results.length} passed\n`
  + fails.map((x) => `FAIL ${x[1]}: got ${JSON.stringify(x[2])}, want ${JSON.stringify(x[3])}`).join('\n');
</script>
