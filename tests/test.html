<!doctype html>
<meta charset="utf-8">
<title>Tests</title>
<pre id="out">running…</pre>
<script type="module">
import { ymd, parseYmd, isoWeek, plural } from '../js/dates.js';
import { makeCal, dayInfo, orthodoxEaster, nextPayday, paydayIn, eventDatesInRange, nextOccurrence, buildCountdowns, countWorkDays, nextHoliday } from '../js/rules.js';
import { defaultState, normalize, encodeShare, decodeShare, mergeStates } from '../js/store.js';

const results = [];
const eq = (name, got, want) => results.push([JSON.stringify(got) === JSON.stringify(want), name, got, want]);

// Serbia (default)
const rs = makeCal(defaultState());
const rsOff = (s) => rs.info(parseYmd(s)).off;
eq('default country', defaultState().settings.country, 'rs');
eq('orthodox Easter', [2021, 2024, 2025, 2026, 2027].map((y) => ymd(orthodoxEaster(y))), ['2021-05-02', '2024-05-05', '2025-04-20', '2026-04-12', '2027-05-02']);
eq('RS 2026 Easter Fri–Mon off', ['2026-04-10', '2026-04-11', '2026-04-12', '2026-04-13', '2026-04-14'].map(rsOff), [true, true, true, true, false]);
eq('RS 2026 Sretenje: Feb 15 Sun → Feb 17', ['2026-02-16', '2026-02-17', '2026-02-18'].map(rsOff), [true, true, false]);
eq('RS 2026 Jan', ['2026-01-01', '2026-01-02', '2026-01-05', '2026-01-07', '2026-01-08'].map(rsOff), [true, true, false, true, false]);
eq('RS 2026 May 2 Sat not moved', rsOff('2026-05-04'), false);
eq('RS 2026 Nov 11', rsOff('2026-11-11'), true);
eq('RS 2023 Jan 1 Sun → Jan 3', ['2023-01-02', '2023-01-03', '2023-01-04'].map(rsOff), [true, true, false]);
eq('RS 2021 May 2 Sun + Easter → May 4', ['2021-04-30', '2021-05-03', '2021-05-04', '2021-05-05'].map(rsOff), [true, true, true, false]);
eq('RS 2027 same as 2021', ['2027-04-30', '2027-05-03', '2027-05-04', '2027-05-05'].map(rsOff), [true, true, true, false]);
eq('RS 2025 Feb 17', rsOff('2025-02-17'), true);
eq('RS Vidovdan is working, marked', [rsOff('2026-06-29'), rs.info(parseYmd('2027-06-28')).observance], [false, 'Видовдан']);
eq('RS May 9 working', rsOff('2025-05-09'), false);
eq('RS payday Jan 2027', ymd(paydayIn(rs, 2027, 0, defaultState().paydays[0])), '2027-01-05');
eq('RS payday Apr 2026 (no shift)', ymd(paydayIn(rs, 2026, 3, defaultState().paydays[0])), '2026-04-03');
eq('RS kind transfer', rs.info(parseYmd('2026-02-17')).kind, 'transfer');
eq('RS next holiday from Nov 19', [ymd(nextHoliday(rs, parseYmd('2026-11-19')).date), nextHoliday(rs, parseYmd('2026-11-19')).name], ['2027-01-01', 'Новый год']);
eq('v1 data migrates ru → rs', normalize({ v: 1, settings: { country: 'ru' } }).settings.country, 'rs');
eq('v2 keeps ru', normalize({ v: 2, settings: { country: 'ru' } }).settings.country, 'ru');
eq('clock off by default', defaultState().settings.analogClock, false);
eq('v2 clock on → off', normalize({ v: 2, settings: { analogClock: true } }).settings.analogClock, false);
eq('big clock on by default', defaultState().settings.bigClock, true);
eq('24h dial by default', defaultState().settings.clock24, true);
eq('12h dial kept', normalize({ v: 3, settings: { clock24: false } }).settings.clock24, false);
eq('big clock off kept', normalize({ v: 3, settings: { bigClock: false } }).settings.bigClock, false);
eq('v3 clock on stays on', normalize({ v: 3, settings: { analogClock: true } }).settings.analogClock, true);
eq('v1 keeps none',normalize({ v: 1, settings: { country: 'none' } }).settings.country, 'none');

// Russia
const st = defaultState();
st.settings.country = 'ru';
const cal = makeCal(st);
const off = (s) => cal.info(parseYmd(s)).off;
const pay = st.paydays[0];

// Production calendar
eq('2026-11-19 work', off('2026-11-19'), false);
eq('2026-01-09 transfer', off('2026-01-09'), true);
eq('2026-01-12 work', off('2026-01-12'), false);
eq('2026-03-09 off', off('2026-03-09'), true);
eq('2026-05-11 off', off('2026-05-11'), true);
eq('2026-06-12 off', off('2026-06-12'), true);
eq('2026-12-31 off', off('2026-12-31'), true);
eq('2026-12-30 work', off('2026-12-30'), false);
eq('2025-11-01 working saturday', off('2025-11-01'), false);
eq('2025-11-03 off', off('2025-11-03'), true);
eq('2025-05-08 off', off('2025-05-08'), true);
eq('2025-03-10 work', off('2025-03-10'), false);
eq('2027-05-03 fallback transfer', off('2027-05-03'), true);
eq('2027-05-10 fallback transfer', off('2027-05-10'), true);
eq('2027-06-14 fallback transfer', off('2027-06-14'), true);
eq('2027-05-04 work', off('2027-05-04'), false);
eq('2027 estimated', cal.info(parseYmd('2027-03-01')).estimated, true);

// Paydays
eq('payday Nov 2026', ymd(paydayIn(cal, 2026, 10, pay)), '2026-11-05');
eq('payday Dec 2026 (5th is Sat)', ymd(paydayIn(cal, 2026, 11, pay)), '2026-12-04');
eq('payday Jan 2027 → Dec 30', ymd(paydayIn(cal, 2027, 0, pay)), '2026-12-30');
eq('next payday from 2026-11-19', ymd(nextPayday(cal, pay, parseYmd('2026-11-19')).date), '2026-12-04');
eq('next payday from 2026-12-05', ymd(nextPayday(cal, pay, parseYmd('2026-12-05')).date), '2026-12-30');
eq('payday after', ymd(paydayIn(cal, 2026, 11, { day: 5, shift: 'after' })), '2026-12-07');
eq('payday 31 in Feb', ymd(paydayIn(cal, 2026, 1, { day: 31, shift: 'none' })), '2026-02-28');

// Events
const yearly = { id: 'a', title: 'Л', date: '2024-02-29', time: '', repeat: 'yearly' };
eq('yearly Feb29 → Feb28', eventDatesInRange(yearly, parseYmd('2027-01-01'), parseYmd('2027-12-31')).map(ymd), ['2027-02-28']);
const monthly = { id: 'b', title: 'M', date: '2026-01-31', time: '', repeat: 'monthly' };
eq('monthly 31st', eventDatesInRange(monthly, parseYmd('2026-02-01'), parseYmd('2026-04-30')).map(ymd), ['2026-02-28', '2026-03-31', '2026-04-30']);
const weekly = { id: 'c', title: 'W', date: '2026-11-02', time: '19:00', repeat: 'weekly' };
eq('weekly', eventDatesInRange(weekly, parseYmd('2026-11-18'), parseYmd('2026-11-30')).map(ymd), ['2026-11-23', '2026-11-30']);
eq('weekly before start', eventDatesInRange(weekly, parseYmd('2026-10-01'), parseYmd('2026-11-05')).map(ymd), ['2026-11-02']);
const timed = { id: 'd', title: 'T', date: '2026-11-19', time: '10:00', repeat: 'none' };
eq('timed past today → null', nextOccurrence(timed, new Date(2026, 10, 19, 12, 0)), null);
eq('timed future today', ymd(nextOccurrence(timed, new Date(2026, 10, 19, 9, 0)).day), '2026-11-19');
const allDay = { id: 'e', title: 'A', date: '2026-11-19', time: '', repeat: 'none' };
eq('all-day today stays', ymd(nextOccurrence(allDay, new Date(2026, 10, 19, 23, 0)).day), '2026-11-19');
const wtimed = { ...weekly, date: '2026-11-19', time: '10:00' };
eq('weekly timed past → next week', ymd(nextOccurrence(wtimed, new Date(2026, 10, 19, 12)).day), '2026-11-26');

// Misc
eq('isoWeek 2026-11-19', isoWeek(parseYmd('2026-11-19')), 47);
eq('isoWeek 2027-01-01', isoWeek(parseYmd('2027-01-01')), 53);
eq('plural', [1, 2, 5, 11, 21, 22].map((n) => plural(n, 'день', 'дня', 'дней')), ['день', 'дня', 'дней', 'дней', 'день', 'дня']);
eq('work days Dec 2026', countWorkDays(cal, parseYmd('2026-12-01'), parseYmd('2027-01-01')), 22);
eq('next holiday from Nov 19', ymd(nextHoliday(cal, parseYmd('2026-11-19')).date), '2027-01-01');
eq('NY block 2026', (() => { const h = nextHoliday(cal, parseYmd('2025-12-20')); return [ymd(h.block.start), ymd(h.block.end)]; })(), ['2025-12-31', '2026-01-11']);

// Overrides
const st2 = defaultState();
st2.overrides['2026-12-04'] = 'off';
eq('override shifts payday', ymd(paydayIn(makeCal(st2), 2026, 11, pay)), '2026-12-03');
eq('country none', dayInfo(parseYmd('2026-01-05'), { country: 'none' }, {}).off, false);

// Countdowns
const st3 = defaultState();
st3.events.push({ id: 'x1', title: 'Отпуск', date: '2026-12-20', time: '', repeat: 'none', color: '#4f5bd5', emoji: '🌴', countdown: true, u: 1 });
const rows = buildCountdowns(makeCal(st3), new Date(2026, 10, 19, 14, 30));
eq('countdown ids', rows.map((r) => r.id), ['workday', 'weekend', 'pay:salary', 'ev:x1', 'holiday']);
eq('work days left during workday', rows.find((r) => r.id === 'weekend').workDays, 2);
const evening = buildCountdowns(makeCal(st3), new Date(2026, 10, 19, 19, 0));
eq('work days left after work', evening.find((r) => r.id === 'weekend').workDays, 1);
const sat = buildCountdowns(makeCal(st3), new Date(2026, 10, 21, 12, 0));
eq('weekend row on Saturday', sat.find((r) => r.id === 'weekend').kind, 'rest');

// Share + merge
const code = await encodeShare(st3);
const back = await decodeShare(`https://x.test/good-calendar/#import=${code}`);
eq('share roundtrip', back.events, st3.events);
eq('share code prefix', code.slice(0, 2), typeof CompressionStream === 'function' ? '1z' : '1j');
const mine = normalize({ events: [{ id: 'k1', title: 'old', date: '2026-12-01', u: 5 }, { id: 'k2', title: 'keep', date: '2026-12-02', u: 5 }] });
const inc = normalize({ events: [{ id: 'k1', title: 'new', date: '2026-12-01', u: 9 }], deleted: { k2: 10 } });
eq('merge', mergeStates(mine, inc).events.map((e) => e.title), ['new']);
eq('sanitize drops junk', normalize({ events: [{ id: '<x>', title: 'a', date: '2026-01-01' }, { id: 'ok', title: '', date: '2026-01-01' }] }).events.length, 0);
let threw = false;
try { await decodeShare('garbage'); } catch { threw = true; }
eq('bad code throws', threw, true);

// Sync: merging overrides and settings by time, replace, canonical form, encryption, pairing
{
  const { canonical, replaceWith } = await import('../js/store.js');
  const sy = await import('../js/sync.js');
  const A = normalize({ v: 3, overrides: { '2026-12-01': 'off', '2026-12-02': 'off' }, overridesU: { '2026-12-01': 10, '2026-12-02': 10 }, settings: { workEnd: '17:00' }, settingsU: 5 });
  const B = normalize({ v: 3, overrides: { '2026-12-02': 'work' }, overridesU: { '2026-12-01': 20, '2026-12-02': 5 }, settings: { workEnd: '19:00' }, settingsU: 9 });
  const AB = mergeStates(A, B);
  eq('override removed on newer side', AB.overrides['2026-12-01'], undefined);
  eq('override kept on newer side', AB.overrides['2026-12-02'], 'off');
  eq('newer settings win', AB.settings.workEnd, '19:00');
  eq('merge is symmetric (canonical)', canonical(mergeStates(A, B)), canonical(mergeStates(B, A)));
  const ev = (id, u) => ({ id, title: id, date: '2026-12-10', u });
  const X = normalize({ v: 3, events: [ev('a', 1), ev('b', 1)] });
  const Y = normalize({ v: 3, events: [ev('b', 1), ev('a', 1)] });
  eq('canonical ignores order', canonical(X) === canonical(Y), true);
  const R = replaceWith(X, normalize({ v: 3, events: [ev('c', 1)] }), 100);
  eq('replace tombstones the rest', [R.deleted.a, R.deleted.b, R.events.map((e) => e.u)], [100, 100, [100]]);
  eq('replace survives merge with old data', mergeStates(X, R).events.map((e) => e.id), ['c']);

  const cfg = { repo: 'o/r', path: 'calendar.enc', token: 'github_pat_' + 'x'.repeat(40), key: sy.newKey() };
  eq('config valid', sy.validConfig(cfg), true);
  const enc = await sy.encryptState(cfg, X);
  eq('ciphertext hides titles', /"title"|\bb\b/.test(JSON.parse(enc).ct), false);
  eq('decrypt roundtrip', canonical(await sy.decryptState(cfg, enc)), canonical(X));
  let kind = '';
  try { await sy.decryptState({ ...cfg, key: sy.newKey() }, enc); } catch (e) { kind = e.kind; }
  eq('wrong key detected', kind, 'key');
  const link = sy.pairingLink(cfg);
  eq('pairing link roundtrip', sy.parsePairing(link), cfg);
  let bad = false;
  try { sy.parsePairing('#sync=abc'); } catch { bad = true; }
  eq('bad pairing rejected', bad, true);
}

// Time picker: tap the dial like a user would
const { pickTime } = await import('../js/timepicker.js');
const tap = (svg, val, ring) => {
  // val: 0..11 position on the dial, ring radius in viewBox units (outer 104, inner 68)
  const r = svg.getBoundingClientRect();
  const a = (val / 12) * Math.PI * 2;
  const x = r.left + ((130 + Math.sin(a) * ring) / 260) * r.width;
  const y = r.top + ((130 - Math.cos(a) * ring) / 260) * r.height;
  for (const type of ['pointerdown', 'pointerup']) svg.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, pointerId: 1, bubbles: true }));
};
const tpRun = async (taps) => {
  const p = pickTime('', { fallback: '09:00', allowEmpty: true });
  const dlg = document.querySelector('dialog.tp-dlg');
  const svg = dlg.querySelector('svg');
  for (const [val, ring] of taps) tap(svg, val, ring);
  dlg.querySelector('[data-tp="ok"]').click();
  return p;
};
eq('picker 3 (outer) : 30', await tpRun([[3, 104], [6, 104]]), '03:30');
eq('picker 15 (inner) : 45', await tpRun([[3, 68], [9, 104]]), '15:45');
eq('picker 00 (inner top) : 05', await tpRun([[0, 68], [1, 104]]), '00:05');
eq('picker 12 (outer top) : 00', await tpRun([[0, 104], [0, 104]]), '12:00');
eq('picker untouched → fallback', await tpRun([]), '09:00');
{
  const p = pickTime('10:20', { allowEmpty: true });
  document.querySelector('dialog.tp-dlg [data-tp="clear"]').click();
  eq('picker clear', await p, '');
  const q = pickTime('10:20');
  document.querySelector('dialog.tp-dlg [data-tp="cancel"]').click();
  eq('picker cancel', await q, null);
}

const fails = results.filter((r) => !r[0]);
document.getElementById('out').textContent = `${results.length - fails.length}/${results.length} passed\n`
  + fails.map((f) => `FAIL ${f[1]}: got ${JSON.stringify(f[2])}, want ${JSON.stringify(f[3])}`).join('\n');
</script>
