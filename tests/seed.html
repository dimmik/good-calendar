<!doctype html>
<meta charset="utf-8">
<title>Seed demo data</title>
<p id="msg">Эта страница <b>заменяет данные календаря в этом браузере</b> демо-данными.
  <a href="#go" onclick="setTimeout(function () { location.reload(); })">Заменить</a></p>
<script>
  // Dev helper: fills localStorage with sample events, then opens the app. Runs only as seed.html#go.
  if (location.hash === '#go') {
  var t = new Date();
  function d(off) {
    var x = new Date(t.getFullYear(), t.getMonth(), t.getDate() + off);
    return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  }
  var state = {
    v: 3,
    events: [
      { id: 'demo1', title: 'Отпуск в горах', date: d(31), time: '', repeat: 'none', color: '#2f9e5b', emoji: '🏔️', countdown: true, u: 1 },
      { id: 'demo2', title: 'День рождения мамы', date: '1961-' + d(9).slice(5), time: '', repeat: 'yearly', color: '#c64fbf', emoji: '🎂', countdown: true, u: 1 },
      { id: 'demo3', title: 'Созвон с командой', date: d(-2), time: '11:00', repeat: 'weekly', color: '#4f5bd5', emoji: '', countdown: true, u: 1 },
      { id: 'demo4', title: 'Стоматолог', date: d(1), time: '16:30', repeat: 'none', color: '#e5534b', emoji: '🦷', countdown: true, u: 1 },
      { id: 'demo5', title: 'Оплатить интернет', date: d(5), time: '', repeat: 'monthly', color: '#e09b19', emoji: '', countdown: false, u: 1 }
    ],
    paydays: [
      { id: 'salary', title: 'Зарплата', day: 5, shift: 'before', u: 0 },
      { id: 'adv', title: 'Аванс', day: 20, shift: 'before', u: 0 }
    ],
    overrides: (function () {
      // one weekday made a day off and the next Saturday made a working day, to show both looks
      var o = {}, i = 3;
      while ([0, 6].indexOf(new Date(t.getFullYear(), t.getMonth(), t.getDate() + i).getDay()) >= 0) i++;
      o[d(i)] = "off";
      while (new Date(t.getFullYear(), t.getMonth(), t.getDate() + i).getDay() !== 6) i++;
      o[d(i)] = "work";
      return o;
    })(),
    deleted: {},
    settings: { country: 'rs', workStart: '09:00', workEnd: '18:00', builtins: { payday: true, weekend: true, workday: true, holiday: true, newyear: true }, weekNumbers: false, theme: 'auto' }
  };
  localStorage.setItem('good-calendar:v1', JSON.stringify(state));
  location.replace('../');
  }
</script>
